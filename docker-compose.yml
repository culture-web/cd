version: "3"

services:
  fe:
    image: culture4web/culture-web-fe:v2.2.0
    networks:
      - app-network

  be:
    image: culture4web/culture-web-be:v2.3.0
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - 80:80
    depends_on:
      - fe
      - be
      - char-recognition
      - expression-recognition
    networks:
      - app-network

  char-recognition:
    image: culture4web/culture-web-microservices:char-recognition_v2.1.0
    networks:
      - app-network

  expression-recognition:
    image: culture4web/culture-web-microservices:expression-recognition_v2.1.0
    networks:
      - app-network
  
  face-detection:
    image: culture4web/culture-web-microservices:face-detection_v2.1.0
    networks:
      - app-network
    

networks:
  app-network:
    driver: bridge
