x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

services:
  fe:
    image: culture4web/culture-web-fe:v2.13.0
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  be:
    image: culture4web/culture-web-be:v2.13.0
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - local-postgres
      - minio
    environment:
      - SOCLAAS_API_KEY=
      - GROQ_MODEL=openai/gpt-oss-120b
    networks:
      - app-network

  nginx:
    build: ./nginx
    ports:
      - 80:80
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - fe
      - be
      - char-recognition
      - expression-recognition
    networks:
      - app-network

  char-recognition:
    image: culture4web/culture-web-microservices:char-recognition_v2.1.1
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  expression-recognition:
    image: culture4web/culture-web-microservices:expression-recognition_v2.1.1
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network
  
  face-detection:
    image: culture4web/culture-web-microservices:face-detection_v2.1.1
    restart: unless-stopped
    logging: *default-logging
    networks:
      - app-network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging
    
  local-postgres:
    image: pgvector/pgvector:pg16
    container_name: local-postgres
    environment:
      - POSTGRES_USER=${LOCAL_DB_USER}
      - POSTGRES_PASSWORD=${LOCAL_DB_PASSWORD}
      - POSTGRES_DB=${LOCAL_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql/data
      - ./init/local_rag_setup.sql:/docker-entrypoint-initdb.d/local_rag_setup.sql:ro
      - ./init/init.sh:/docker-entrypoint-initdb.d/99-init.sh:ro
    networks:
      - app-network
    restart: unless-stopped
    logging: *default-logging

networks:
  app-network:
    driver: bridge

volumes:
  local_pgdata:
  minio_data:
